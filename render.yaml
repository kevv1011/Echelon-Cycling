# Backend only. Supply a durable PostgreSQL URL and Google credentials in Render.
# The free API instance sleeps when idle; choose paid compute for consistent availability.
services:
  - type: web
    name: echelon-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r server/requirements.txt
    startCommand: python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: ECHELON_AUTH_MODE
        value: google
      - key: ECHELON_COOKIE_SECURE
        value: 'true'
      - key: APP_ORIGIN
        value: https://echelon-cycling.vercel.app
      - key: CORS_ORIGINS
        value: https://echelon-cycling.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_STATE_SECRET
        generateValue: true
